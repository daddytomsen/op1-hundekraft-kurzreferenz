<h3 id="erase">Fast tape erase</h3>
<p>The stock erase gesture ([[Shift]] + [[tape]], then press [[T1]] to [[T4]] together) now only clears the parts of the tape that have audio, so it takes seconds instead of minutes. It can&#x27;t be undone, and it clears the <a href="#undo">undo</a> history.</p>
