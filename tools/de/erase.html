<div class="sub">
<h3 id="erase">Schnelles Tape-Löschen</h3>
<p>Die bekannte Löschgeste ([[Shift]] + [[tape]], dann [[T1]] bis [[T4]] zusammen drücken) löscht jetzt nur noch die Teile des Tapes, auf denen Audio liegt, und braucht deshalb Sekunden statt Minuten. Sie lässt sich nicht rückgängig machen und löscht auch den <a href="#undo">Undo</a>-Verlauf.</p>
</div>
