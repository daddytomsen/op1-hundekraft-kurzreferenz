<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1011">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OP-1 Referenz">
<title>OP-1 hundekraft – Kurzreferenz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --alu:#d5d8da;--alu-hi:#e6e8e9;--alu-lo:#b9bdc1;
  --panel:#eceeef;--line:#c3c7ca;
  --ink:#15171a;--mut:#596068;
  --disp:#0f1011;--disp-tx:#f1f2f2;--disp-mut:#8c9299;
  --b:#2b6fe3;--g:#2aa457;--w:#fbfbfa;--o:#f2601f;
  --cap:#f7f7f5;--cap-edge:#9a9fa4;
  --ease:cubic-bezier(.22,.9,.3,1);
  --f:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none;background:var(--alu)}
body{margin:0;color:var(--ink);font:400 16px/1.45 var(--f);font-stretch:100%;
  background:linear-gradient(180deg,var(--alu-hi),var(--alu) 320px) fixed;min-height:100dvh}
button,input{font:inherit;color:inherit}
button,a,[role=button]{touch-action:manipulation}
button,[role=button],kbd{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}

/* ---- Display: der schwarze Bildschirm oben ---- */
.display{position:sticky;top:0;z-index:5;background:var(--disp);color:var(--disp-tx);
  padding:calc(10px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 14px calc(16px + env(safe-area-inset-left));
  border-radius:0 0 22px 22px;box-shadow:0 1px 0 #fff8 inset,0 10px 24px -14px #000a}
.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.brand b{font-weight:700;font-stretch:78%;font-size:19px;letter-spacing:.3px}
.brand span{color:var(--disp-mut);font-size:13px;margin-left:8px;font-weight:400;font-stretch:100%;letter-spacing:0}
.dots{display:flex;gap:7px}
.dots i{width:11px;height:11px;border-radius:50%;display:block}
.dots i:nth-child(1){background:var(--b)}.dots i:nth-child(2){background:var(--g)}.dots i:nth-child(3){background:var(--w)}.dots i:nth-child(4){background:var(--o)}
.search{position:relative}
.search svg{position:absolute;left:13px;top:13px;width:18px;height:18px;stroke:var(--disp-mut);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.search input{width:100%;height:44px;border-radius:12px;border:1.5px solid #2c2f33;background:#1a1c1e;color:var(--disp-tx);padding:0 42px 0 40px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--disp-mut)}
.search input::-webkit-search-cancel-button{display:none}
.search input:focus{border-color:var(--o)}
.search button{position:absolute;right:4px;top:4px;width:36px;height:36px;border:0;background:none;color:var(--disp-mut);font-size:17px}

main{padding:18px calc(16px + env(safe-area-inset-right)) calc(108px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));max-width:720px;margin:0 auto}
.lead{font-weight:700;font-stretch:76%;font-size:40px;line-height:1;letter-spacing:-.4px;margin:6px 0 6px}
.sub{color:var(--mut);margin:0 0 18px;max-width:34em}
h2{font-size:15px;font-weight:700;margin:24px 2px 9px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-weight:400;color:var(--mut);font-size:13px}

/* ---- Tastenkappen ---- */
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:28px;padding:0 8px;margin:2px 1px;
  font:600 13px/1 var(--f);font-stretch:88%;color:var(--ink);background:linear-gradient(180deg,#fff,var(--cap));
  border-radius:7px;box-shadow:0 0 0 1px var(--cap-edge),0 2.5px 0 0 var(--cap-edge);white-space:nowrap;vertical-align:middle;position:relative;top:-1px}
kbd.sh{background:linear-gradient(180deg,#3b4046,#24272b);color:#fff;box-shadow:0 0 0 1px #121416,0 2.5px 0 0 #121416}
kbd.rec{color:#d8361c}
.display kbd,.screen kbd{box-shadow:0 0 0 1px #000,0 2.5px 0 0 #3a3e43}

/* ---- Encoder-Knopf ---- */
.knob{--c:var(--w);flex:0 0 auto;width:15px;height:15px;border-radius:50%;display:inline-block;vertical-align:-2px;
  background:radial-gradient(circle at 50% 35%,#fff7 0 18%,transparent 19%),var(--c);box-shadow:0 0 0 1.5px #0003 inset,0 1px 1.5px #0005}
.knob.b{--c:var(--b)}.knob.g{--c:var(--g)}.knob.w{--c:var(--w)}.knob.o{--c:var(--o)}
.enc{white-space:nowrap;font-weight:600}
.knob.big{width:44px;height:44px;position:relative;background:radial-gradient(circle at 50% 28%,#ffffff70,transparent 58%),var(--c);
  box-shadow:0 0 0 2px #0002 inset,0 0 0 5px var(--alu-hi),0 0 0 6px var(--line),0 5px 7px -1px #0006}
.knob.big::after{content:"";position:absolute;left:50%;top:5px;width:3px;height:12px;margin-left:-1.5px;border-radius:2px;background:#0000008c}
.knob.big.b::after,.knob.big.o::after,.knob.big.g::after{background:#ffffffd9}

/* ---- Listen ---- */
.list{background:var(--panel);border-radius:18px;box-shadow:0 0 0 1px var(--line),0 1px 0 1px #fff inset;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 6px 12px 14px;min-height:60px;border:0;background:none;
  border-top:1px solid var(--line);cursor:pointer;transition:background .12s}
.li:first-child{border-top:0}
.li:active{background:#dfe2e4}
.li .tx{flex:1;min-width:0}
.li b{display:block;font-size:16.5px;font-weight:600;line-height:1.25}
.li .s{display:block;color:var(--mut);font-size:14px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.li .combo{margin-top:5px;line-height:2;color:var(--mut);font-size:14px}
.li .cat{flex:0 0 auto;color:var(--mut);font-size:12.5px;font-stretch:85%}
.li .go{flex:0 0 auto;width:30px;text-align:center;color:var(--alu-lo);font-size:22px;line-height:1}
.star{flex:0 0 auto;width:44px;height:44px;border:0;background:none;display:grid;place-items:center;transition:transform .14s var(--ease)}
.star svg{width:22px;height:22px;fill:none;stroke:#8b9197;stroke-width:1.8;stroke-linejoin:round}
.star.on svg{fill:var(--o);stroke:var(--o)}
.star:active{transform:scale(.82)}

/* ---- Chips als Tasten ---- */
.keys{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:3px 16px 8px;scroll-snap-type:x proximity}
.keys::-webkit-scrollbar{display:none}
.key{flex:0 0 auto;scroll-snap-align:start;border:0;border-radius:11px;min-height:42px;padding:0 15px;font-weight:600;font-size:14.5px;font-stretch:90%;
  background:linear-gradient(180deg,#fff,var(--cap));box-shadow:0 0 0 1px var(--cap-edge),0 3px 0 0 var(--cap-edge);transition:transform .1s,box-shadow .1s;margin-bottom:3px}
.key:active,.key.on{transform:translateY(2px);box-shadow:0 0 0 1px var(--cap-edge),0 1px 0 0 var(--cap-edge)}
.key.on{background:linear-gradient(180deg,#34383d,#202326);color:#fff;box-shadow:0 0 0 1px #111,0 1px 0 0 #111}
.key small{font-weight:400;opacity:.6;margin-left:5px}

.empty{color:var(--mut);padding:34px 18px;text-align:center}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

/* ---- Tableiste: vier Tasten ---- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px calc(12px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
  background:linear-gradient(180deg,#d5d8da00,var(--alu) 34%);pointer-events:none}
nav div{pointer-events:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:520px;margin:0 auto}
nav button{border:0;border-radius:13px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;font-stretch:88%;
  background:linear-gradient(180deg,#fff,var(--cap));box-shadow:0 0 0 1px var(--cap-edge),0 4px 0 0 var(--cap-edge),0 8px 14px -6px #0006;transition:transform .1s,box-shadow .1s;position:relative}
nav button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button:active,nav button.on{transform:translateY(3px);box-shadow:0 0 0 1px var(--cap-edge),0 1px 0 0 var(--cap-edge),0 3px 6px -3px #0005}
nav button.on::after{content:"";position:absolute;top:7px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--o);box-shadow:0 0 6px var(--o)}

/* ---- Detailblatt ---- */
#sheet{position:fixed;inset:0;z-index:10;height:100dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  background:linear-gradient(180deg,var(--alu-hi),var(--alu) 320px);transform:translateX(102%);transition:transform .32s var(--ease);visibility:hidden}
#sheet.open{transform:none;visibility:visible}
.screen{background:var(--disp);color:var(--disp-tx);border-radius:0 0 26px 26px;
  padding:calc(6px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 22px calc(16px + env(safe-area-inset-left));box-shadow:0 12px 26px -16px #000b}
.bar{display:flex;align-items:center;justify-content:space-between;margin:0 -8px 10px}
.bar button{border:0;background:none;height:44px;min-width:44px;padding:0 8px;color:var(--disp-tx);font-size:16px;font-weight:600;display:flex;align-items:center;gap:4px}
.bar button:active{opacity:.6}
.bar .star svg{stroke:var(--disp-mut);width:25px;height:25px}
.bar .star.on svg{stroke:var(--o)}
.screen .cat{color:var(--disp-mut);font-size:14px}
.screen h3{font-weight:700;font-stretch:75%;font-size:clamp(40px,13vw,58px);line-height:.95;letter-spacing:-.5px;margin:4px 0 10px;overflow-wrap:anywhere}
.screen p{margin:0;color:#c9cdd1;font-size:16.5px;max-width:32em}
.strip{display:flex;gap:6px;margin-top:18px}
.strip i{height:5px;flex:1;border-radius:3px}
.strip i:nth-child(1){background:var(--b)}.strip i:nth-child(2){background:var(--g)}.strip i:nth-child(3){background:var(--w)}.strip i:nth-child(4){background:var(--o)}
.det{padding:6px calc(16px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));max-width:720px;margin:0 auto}
.path{background:var(--panel);border-radius:18px;box-shadow:0 0 0 1px var(--line),0 1px 0 1px #fff inset;padding:14px 16px;font-size:16px;line-height:2.15}
.er{display:flex;gap:16px;padding:16px 14px 16px 18px;border-top:1px solid var(--line);align-items:flex-start}
.er:first-child{border-top:0}
.er .knob{margin-top:4px}
.er .b2{flex:1;min-width:0}
.er .nm{font-weight:700;font-size:17px;font-stretch:88%;line-height:1.2}
.er p{margin:4px 0 0;font-size:15.5px;line-height:1.4}
.er p em{font-style:normal;font-weight:600;color:var(--mut);font-size:13px;display:block;margin-top:8px}
.kr{padding:13px 16px;border-top:1px solid var(--line)}
.kr:first-child{border-top:0}
.kr .c{line-height:2}
.kr .d{display:block;margin-top:2px;font-size:15.5px;line-height:1.4}
ul.n{margin:0;padding:12px 16px 12px 34px;font-size:15.5px}
ul.n li{margin:6px 0}
a.orig{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:22px;height:52px;border-radius:13px;color:var(--ink);text-decoration:none;font-weight:600;
  background:linear-gradient(180deg,#fff,var(--cap));box-shadow:0 0 0 1px var(--cap-edge),0 4px 0 0 var(--cap-edge);transition:transform .1s,box-shadow .1s}
a.orig:active{transform:translateY(3px);box-shadow:0 0 0 1px var(--cap-edge),0 1px 0 0 var(--cap-edge)}
.foot{color:var(--mut);font-size:13px;margin:26px 2px 0;line-height:1.5}
.foot a{color:inherit}
@media (hover:hover) and (pointer:fine){.li:hover{background:#e3e6e8}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="display">
  <div class="brand"><b>hundekraft<span>Kurzreferenz 3.3.1</span></b><div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div>
  <div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Synth, Effekt, Taste, Funktion" aria-label="Suchen" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"><button id="qx" aria-label="Suche leeren" hidden>✕</button></div>
</header>
<main id="main"></main>
<nav><div>
  <button data-tab="start"><svg viewBox="0 0 24 24"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg>Schnell</button>
  <button data-tab="alle"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Alle</button>
  <button data-tab="favoriten"><svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 17l-5.2 2.7 1-5.9L3.5 9.7l5.9-.8z"/></svg>Favoriten</button>
  <button data-tab="tasten"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M7 10h.01M11 10h.01M15 10h.01M8 14h8"/></svg>Tasten</button>
</div></nav>
<div id="sheet" aria-hidden="true"></div>
<script>
const BASE="https://hundekraft.github.io/op1-workshop/manual.html?version=3.3.1&without=bitcrush,blot,brassophone,dddd,father,grids,hollowsaint,juni,juni_chorus,nostromo,plate_o,ploc,steve,vapora#";
const CAT={synth:"Synths",drum:"Drums",fx:"Effekte",play:"Spielen & Sequenzer",tape:"Tape & Sampler",sys:"System & MIDI"};
const D=[];
const SY="[synth], dann [Shift]+[T1] → „";
const add=(c,id,n,t,o,e,k,x,cols)=>D.push({c,id,n,t,o,e,k,x,cols});
const S=(id,n,t,e,k,x,cols,pick)=>add("synth",id,n,t,SY+(pick||n.toLowerCase())+"“ wählen, mit [T1] laden",e,k,x,cols);
const F=(id,n,t,e,k,x,cols)=>add("fx",id,n,t,"Auf Synth- oder Drum-Slot: [Shift]+[T3] → „"+n.toLowerCase()+"“. Als Master-Effekt: im Mixer wie gewohnt",e,k,x,cols);
const TS=["Drehen","Shift + Drehen"],TSP=["Drehen","Shift + Drehen","Drücken"],TP=["Drehen","Drücken"];

/* ---------- SYNTHS ---------- */
S("wavetable","Wavetable","Zwei morphende Oszillatoren mit Ladder-Filter.",[["Wave","Wellenposition: Sinus → warm → Dreieck → Säge → Rechteck → Puls → Vokal → digital, stufenlos"],["Detune","Verstimmung der beiden Oszillatoren, 0 bis ca. 27 Cent"],["Cutoff","Filterfrequenz, 30 Hz bis 16 kHz"],["Resonance","Resonanz bis zur Selbstoszillation, treibt das Filter zusätzlich an"]]);
S("taffy","Taffy","Phasenverzerrung im Stil der Casio-CZ-Synths, ohne Filter.",[["Shape","Wellenform: Säge, Rechteck, Puls, Säge-Puls, mit Übergängen"],["Distortion","Stärke der Verzerrung: reiner Cosinus bis hell"],["Envelope","Zusätzliche Verzerrung am Notenanfang (klingt in ca. 0,2 s ab) – von aus bis kräftiger Pluck"],["Resonance","Mischt die resonante CZ-Welle dazu"]]);
S("pew","Pew","Zugriegel-Orgel mit Rotary-Lautsprecher.",[["Register","Zugriegel-Kombinationen von weich bis voll, in ganzen Stufen"],["Percussion","Aus → weiche 2. Harmonische → scharfe 3. → mehr Tastenklick. Nur beim ersten Anschlag (wie Hammond)"],["Drive / chorus","Sauber → Scanner-Vibrato bis Chorus → Röhren-Drive"],["Leslie","Drei Zonen: Bremse, langsam, schnell – mit trägem Anlauf"]]);
S("elg","Elg","Ein rufender Elch unter Nordlichtern: Stimme plus Flächen-Pad.",[["Call","Vokal, Tonhöhen-Schleifer und Häufigkeit der Rufe","Throat: Größe des Tiers (Bulle bis Kalb)"],["Breath","Atemgeräusch, leichtes Wackeln, Breite der Aurora","Call time: Dauer eines Rufs, 0,4–2,5 s"],["Body","Growl/Drive, Sub-Pegel, Brustresonanz, Helligkeit","Sub: aus, −1 Oktave, −2 Oktaven oder beide"],["Aurora","Vom reinen Tier zum Himmels-Pad; Tempo/Schärfe der Bänder","Drift: Klangfarbe der Aurora (tief, weit, hoch, folgt der Taste)"]],null,["Es gibt zusätzlich die Variante „Classic“ mit eigener Belegung: Interval (dritte Säge), Detune, Timbre (Filter + Growl), Movement (LFO)."],TS);
S("eva","EVA","Astronauten-Chor über Helmfunk.",[["Pressure","Helligkeit und Attack: weich/fern bis hell/nah"],["Freq","Vokal: u – a – i"],["Oxygen","Luft und Breite: Atem im Attack, Chorus-Tiefe, langsames Anschwellen"],["Com","Funk-Charakter: bis 40 % wärmer, darüber dünner mit Rauschen, Aussetzern und Piepsern. Drücken: Oktave tiefer / original / höher"]]);
S("mbira","MBIRA","Daumenklavier mit Kronkorken.",[["Strike","Anschlag: weicher Daumen bis harter Nagel"],["Tine","Material der Zunge: Holz – Stahl – Glas"],["Box","Resonanz und Wumms des Holzkastens (0 = aus)"],["Buzz","Rasseln der Kronkorken"]]);
S("drift","DRIFT","Ein neuronales Netz statt Oszillator.",null,null,["Die vier Encoder haben keine Einzelfunktion – zusammen bestimmen sie die Position im Klangraum des Netzes. Am besten ein Preset laden und jeweils einen Encoder drehen.","Encoder drücken hat keine Funktion. [T2] ist wie üblich die Hüllkurve."],null,"DRIFT");
S("ludwig","LUDWIG","Konzertflügel mit 88 Tasten.",[["Hammer","Welche Anschlagstärke klingt (Mitte = folgt dem Spiel)","Release: wie schnell die Dämpfer greifen"],["Stretch","Spreizung der Obertöne: rein – wie aufgenommen – glockig","Attack"],["Sustain","Ausklingzeit: bis 4× kürzer oder länger","Tuning: 8 Stimmungen (gleichstufig 440/430, Vallotti, Young, Werckmeister III, Kirnberger III, Mitteltönig …)"],["Tone","Helligkeit, Mitte = neutral","Pedal: rechts an, links aus"]],[["[Shift] + {o} drücken","Haltepedal an/aus (wird mit dem Sound gespeichert)"],["Encoder drücken","Springt auf den geladenen Wert zurück; mit [Shift] für den Shift-Wert"]],["Die OP-1-Hüllkurve wirkt nicht; [T2] zeigt stattdessen eine Kurzhilfe."],TS,"LUDWIG");
S("windwood","Windwood","Physikalisch modellierte Klarinette.",[["Breath","Blasdruck – vor allem Klangfarbe, Start bei 80 %"],["Growl","Mitte = aus; links gesummtes Growl, rechts Flatterzunge"],["Bore","Helligkeit des Rohrs"],["Air","Atemgeräusch"]],null,["Die Hüllkurve auf [T2] ist der Atem: Attack = Crescendo (ca. 135 ms klingt natürlich).","Gebunden spielen (Taste drücken, während eine andere klingt) ergibt ein Legato."]);
S("pinboard","PINBOARD","Synth, den man mit Steckstiften patcht.",[["Shape","Oszillator: Sinus → gebogen mit Osc 2 → Säge mit Puls","Osc 2 tune: Intervall in 8 Stufen"],["Frequency","Filterfrequenz","Noise: Pegel und Farbe; ganz oben nur noch Rauschen"],["Response","Resonanz, oben selbstschwingend","Ring: Ringmodulation Osc 1 × Osc 2"],["Patch","Eines von 64 Pin-Mustern, danach CUSTOM (eigenes Brett)","Osc 3 rate: 0,025 Hz bis 500 Hz"]],[["{o} drücken","Großes Steckbrett: {b} Quelle, {g} Ziel, {w} Pin (aus / voll / sanft / invertiert). Nochmal {o} = zurück"],["[T2]","Eigene Trapez-Hüllkurve: {b} Attack, {g} Haltezeit, {w} Decay, {o} Pause vor Wiederholung"]],null,TS,"PINBOARD");
S("vox","VOX","Vocoder: deine Stimme, auf den Tasten gespielt.",[["Wave","Trägerklang: Säge → Rechteck → Puls → 3 Sägen → Rauschen"],["Formant","Verschiebt die Stimmbänder ±12 Halbtöne (größer/kleiner), Tonhöhe bleibt"],["Response","Links weich und träge, rechts scharf und robotisch"],["Air","Lässt Atem und Zischlaute durch – bessere Verständlichkeit"]]);

const $=s=>document.querySelector(s),main=$("#main"),sheet=$("#sheet"),q=$("#q");
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const EN={b:"blau",g:"grün",w:"weiß",o:"orange"};
const KL={left:"◀",right:"▶",lift:"lift",drop:"drop",scissors:"✂",metronome:"metronom",REC:"● rec",PLAY:"▶ play",STOP:"■ stop"};

function fmt(s){return esc(s||"").replace(/\[([^\]]+)\]/g,(m,k)=>`<kbd${k==="Shift"?' class="sh"':k==="REC"?' class="rec"':''}>${KL[k]||k}</kbd>`).replace(/\{([bgwo])\}/g,(m,k)=>`<span class="enc"><i class="knob ${k}"></i> ${EN[k]}</span>`)}
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let fav=new Set(store.get("op1ref-fav",[])),recent=store.get("op1ref-recent",[]),tab="start",cat="all";
const TABS=["start","alle","favoriten","tasten"];
const byId=id=>D.find(d=>d.id===id);
D.forEach(d=>{d.hay=[d.n,d.t,d.o,CAT[d.c],(d.e||[]).flat().join(" "),(d.k||[]).flat().join(" "),(d.x||[]).join(" ")].join(" ").toLowerCase()});
const starBtn=id=>`<button class="star ${fav.has(id)?"on":""}" data-fav="${id}" aria-label="${fav.has(id)?"Favorit entfernen":"Als Favorit merken"}" aria-pressed="${fav.has(id)}">${STAR}</button>`;
const item=(d,showCat)=>`<div class="li" role="button" tabindex="0" data-open="${d.id}"><div class="tx"><b>${esc(d.n)}</b><span class="s">${esc(d.t)}</span></div>${showCat===true?`<span class="cat">${CS[d.c]}</span>`:""}${starBtn(d.id)}</div>`;
const quick=x=>`<div class="li" role="button" tabindex="0" data-open="${x[2]}"><div class="tx"><b>${esc(x[0])}</b><div class="combo">${fmt(x[1])}</div></div><span class="go" aria-hidden="true">›</span></div>`;
const list=a=>`<div class="list">${a.join("")}</div>`;
function render(){
  document.querySelectorAll("nav button").forEach(b=>{const on=b.dataset.tab===tab&&!q.value.trim();b.classList.toggle("on",on);on?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current")});
  const term=q.value.trim().toLowerCase();$("#qx").hidden=!term;
  let h="";
  if(term){
    const words=term.split(/\s+/);
    const hits=D.filter(d=>words.every(w=>d.hay.includes(w))).sort((a,b)=>(b.n.toLowerCase().includes(words[0])-a.n.toLowerCase().includes(words[0])));
    const qh=Q.filter(x=>words.every(w=>(x[0]+" "+x[1]).toLowerCase().includes(w)));
    const n=hits.length+qh.length;
    if(!n)h=`<div class="empty"><b>Nichts gefunden</b>Probier den englischen Begriff vom Display, zum Beispiel „cutoff“ oder „reverb“.</div>`;
    else{
      h=`<h2>${n} Treffer</h2>`;
      if(qh.length)h+=list(qh.map(quick))+(hits.length?`<h2>Einträge</h2>`:"");
      if(hits.length)h+=list(hits.map(d=>item(d,true)));
    }
  }else if(tab==="start"){
    h=`<h1 class="lead">Wo ist was?</h1><p class="sub">${D.length} Synths, Effekte und Werkzeuge deines Builds – mit Tastenweg und Encoder-Belegung.</p>`;
    const fv=D.filter(d=>fav.has(d.id));
    if(fv.length)h+=`<h2>Favoriten</h2><div class="keys">${fv.map(d=>`<button class="key" data-open="${d.id}">${esc(d.n)}</button>`).join("")}</div>`;
    const rc=recent.map(byId).filter(d=>d&&!fav.has(d.id));
    if(rc.length)h+=`<h2>Zuletzt angesehen</h2><div class="keys">${rc.map(d=>`<button class="key" data-open="${d.id}">${esc(d.n)}</button>`).join("")}</div>`;
    h+=`<h2>Schnellzugriffe</h2>`+list(Q.map(quick))+foot();
  }else if(tab==="alle"){
    h=`<div class="keys"><button class="key ${cat==="all"?"on":""}" data-cat="all">Alle<small>${D.length}</small></button>${Object.keys(CAT).map(c=>`<button class="key ${cat===c?"on":""}" data-cat="${c}">${CAT[c]}<small>${D.filter(d=>d.c===c).length}</small></button>`).join("")}</div>`;
    Object.keys(CAT).filter(c=>cat==="all"||cat===c).forEach(c=>{const a=D.filter(d=>d.c===c);h+=`<h2>${CAT[c]}<small>${a.length}</small></h2>`+list(a.map(d=>item(d)))});
  }else if(tab==="favoriten"){
    const fv=D.filter(d=>fav.has(d.id));
    h=`<h1 class="lead">Favoriten</h1>`+(fv.length?`<p class="sub">Was du oft brauchst, mit dem Tastenweg auf einen Blick.</p>`+list(fv.map(d=>`<div class="li" role="button" tabindex="0" data-open="${d.id}"><div class="tx"><b>${esc(d.n)}</b><div class="combo">${fmt(d.o)}</div></div>${starBtn(d.id)}</div>`)):`<div class="empty"><b>Noch nichts gemerkt</b>Tippe bei einem Eintrag auf den Stern, dann liegt er hier und oben im Schnellzugriff.</div>`);
  }else{
    const L=(a)=>list(a.map(r=>`<div class="kr"><div class="c">${fmt(r[0])}</div><span class="d">${r[1]}</span></div>`));
    h=`<h1 class="lead">Tasten lesen</h1><p class="sub">So sind die Angaben in dieser Referenz gemeint.</p>`+
    L([["{b} {g} {w} {o}","Die vier Encoder von links nach rechts. Drehen ändert einen Wert, Drücken nutzt den Encoder als Taste."],
       ["[Shift]+[help]","Shift halten und die zweite Taste drücken."],
       ["[T1] [T2] [T3] [T4]","Die vier Tasten unter dem Display."],
       ["[synth] [drum] [tape] [mixer]","Die vier Modus-Tasten."],
       ["[COM]","Die Album-Taste oben rechts. COM ist ihre Shift-Funktion."],
       ["[seq] [lift] [drop] [scissors]","Sequenzer-Taste und die drei Tape-Edit-Tasten."],
       ["[REC] [PLAY] [STOP] [left] [right]","Transport und Pfeiltasten."],
       ["Soundtasten 1–8","Die acht kleinen Nummerntasten rechts von T4. Sie speichern und laden Sounds."]])+
    `<h2>Überall gleich</h2>`+
    L([["[Shift]+[T1]","Synth- oder Drum-Typ wählen"],["[Shift]+[T3]","Effekt wählen"],["[Shift]+[T4]","LFO wählen"],["[Shift]+[seq]","Sequenzer wählen"],["[Shift]+[help]","Uhr oder Karte; von dort [T1] Monitor, [T3] Settings, [T4] Chord".replace(/\[(T\d)\]/g,"<kbd>$1</kbd>")]])+foot();
  }
  main.innerHTML=h;
}
function foot(){return `<p class="foot">Eigene deutsche Zusammenfassung zur hundekraft-Firmware 3.3.1 für die originale OP-1, keine vollständige Übersetzung. Reglernamen stehen wie auf dem Display. Ausführliche Texte und Bilder: <a href="${BASE}map">Original-Handbuch</a> des hundekraft-Projekts (GPL-3.0). Favoriten bleiben nur in diesem Browser gespeichert.</p>`}
function detail(id){
  const d=byId(id);if(!d)return;
  recent=[id,...recent.filter(x=>x!==id)].slice(0,8);store.set("op1ref-recent",recent);
  const cols=d.cols||[];
  let h=`<div class="screen"><div class="bar"><button data-close aria-label="Zurück">‹ Zurück</button>${starBtn(id)}</div><span class="cat">${CAT[d.c]}</span><h3>${esc(d.n)}</h3><p>${esc(d.t)}</p><div class="strip" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div><div class="det">`;
  h+=`<h2>So kommst du hin</h2><div class="path">${fmt(d.o)}</div>`;
  if(d.e){h+=`<h2>Encoder</h2><div class="list">`+d.e.map((r,i)=>{const k="bgwo"[i];let p="";for(let j=1;j<r.length;j++){if(!r[j]||r[j]==="–")continue;p+=`<p>${cols.length>1?`<em>${esc(cols[j-1]||"")}</em>`:""}${fmt(r[j])}</p>`}
      return `<div class="er"><i class="knob big ${k}" role="img" aria-label="Encoder ${EN[k]}"></i><div class="b2"><div class="nm">${esc(r[0]||EN[k][0].toUpperCase()+EN[k].slice(1))}</div>${p}</div></div>`}).join("")+`</div>`}
  if(d.k)h+=`<h2>Tasten und Kürzel</h2><div class="list">${d.k.map(r=>`<div class="kr"><div class="c">${fmt(r[0])}</div><span class="d">${fmt(r[1])}</span></div>`).join("")}</div>`;
  if(d.x)h+=`<h2>Gut zu wissen</h2><div class="list"><ul class="n">${d.x.map(x=>`<li>${fmt(x)}</li>`).join("")}</ul></div>`;
  h+=`<a class="orig" href="${BASE}${d.id==="install"?"quick-start":d.id}">Im Original nachlesen (englisch)</a></div>`;
  sheet.innerHTML=h;sheet.scrollTop=0;sheet.classList.add("open");sheet.setAttribute("aria-hidden","false");
}
function closeSheet(){sheet.classList.remove("open");sheet.setAttribute("aria-hidden","true");render()}
function toggleFav(id){fav.has(id)?fav.delete(id):fav.add(id);store.set("op1ref-fav",[...fav])}
document.addEventListener("click",e=>{
  const f=e.target.closest("[data-fav]");if(f){e.stopPropagation();toggleFav(f.dataset.fav);const on=fav.has(f.dataset.fav);f.classList.toggle("on",on);f.setAttribute("aria-pressed",on);if(!sheet.classList.contains("open")&&tab==="favoriten"&&!q.value.trim())render();return}
  if(e.target.closest("[data-close]")){closeSheet();return}
  const o=e.target.closest("[data-open]");if(o){detail(o.dataset.open);return}
  const c=e.target.closest("[data-cat]");if(c){cat=c.dataset.cat;render();return}
  const t=e.target.closest("[data-tab]");if(t){tab=t.dataset.tab;q.value="";try{location.hash=tab}catch(_){}render();window.scrollTo(0,0);return}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".li[data-open]")){e.preventDefault();detail(e.target.dataset.open)}if(e.key==="Escape"&&sheet.classList.contains("open"))closeSheet()});
q.addEventListener("input",()=>{render();window.scrollTo(0,0)});
$("#qx").addEventListener("click",()=>{q.value="";render();q.focus()});
let sx=0,sy=0;sheet.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
sheet.addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx,dy=Math.abs(e.changedTouches[0].clientY-sy);if(sx<40&&dx>70&&dy<60)closeSheet()},{passive:true});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(TABS.includes(h)&&h!==tab){tab=h;render()}});
const h0=location.hash.slice(1);if(TABS.includes(h0))tab=h0;
render();

</script>
</body>
</html>
